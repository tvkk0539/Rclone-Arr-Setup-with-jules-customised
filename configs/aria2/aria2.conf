# Aria2 Configuration File
# Optimized for Rclone Upload

# Basic Options
dir=/downloads
rpc-secret=${RPC_SECRET}
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=true

# Automation Hook
# Run this script when a download completes
on-download-complete=/scripts/aria_manage.sh

# Performance Tuning
max-connection-per-server=16
min-split-size=10M
split=32
max-overall-download-limit=0
max-download-limit=0
max-overall-upload-limit=0
max-upload-limit=0
seed-time=0
seed-ratio=0.0

# Session Saving
input-file=/config/aria2.session
save-session=/config/aria2.session
save-session-interval=60
force-save=true
log=/logs/aria2.log
log-level=notice
