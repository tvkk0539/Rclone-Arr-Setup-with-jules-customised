services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
      - RCLONE_REMOTE=${RCLONE_REMOTE}
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
      - QBIT_PASSWORD=${QBIT_PASSWORD}
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs:/config  # dont add qBittorrent in host folder - qbit automatically creates one
      - ${DOWNLOADS_FOLDER}:/downloads
      - ${MEDIA_SERVER_ROOT}/logs:/logs
      - ${MEDIA_SERVER_ROOT}/scripts:/scripts
      - ${MEDIA_SERVER_ROOT}/locks:/tmp/locks
    ports:
      - 8080:8080
    restart: unless-stopped
    
  aria2:
    image: p3terx/aria2-pro:latest
    container_name: aria2
    environment:
      - PUID=1000
      - PGID=1000
      - RPC_SECRET=${RPC_SECRET}
      - RPC_PORT=6800
      - RCLONE_REMOTE=${RCLONE_REMOTE}
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
      - TZ=Asia/Kolkata
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/aria2:/config
      - ${DOWNLOADS_FOLDER}:/downloads
      - ${MEDIA_SERVER_ROOT}/logs:/logs
      - ${MEDIA_SERVER_ROOT}/scripts:/scripts
      - ${MEDIA_SERVER_ROOT}/locks:/tmp/locks
    ports:
      - 6800:6800
    restart: unless-stopped
    
  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - RCLONE_REMOTE=${RCLONE_REMOTE}
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/jdownloader:/config
      - ${DOWNLOADS_FOLDER}:/downloads
      - ${MEDIA_SERVER_ROOT}/scripts:/scripts
      - ${MEDIA_SERVER_ROOT}/logs:/logs
    ports:
      - 5800:5800
    restart: unless-stopped

  ariang:
    image: p3terx/ariang:latest
    container_name: ariang
    ports:
      - 6880:6880
    restart: unless-stopped
    
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    command: > # --log-file /logs/rclone.log --log-level INFO --log-format date,time  (if you need to save in file)
      rcd --rc-web-gui 
      --rc-addr :5572 
      --rc-user ${RCLONE_USER} 
      --rc-pass ${RCLONE_PASS} 
      --rc-serve
      --config /config/rclone/rclone.conf
    environment:
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/rclone:/config/rclone
      - ${DOWNLOADS_FOLDER}:/downloads  
      - ${MEDIA_SERVER_ROOT}/logs:/logs
    ports:
      - 5572:5572
    restart: unless-stopped

  mount:
    image: rclone/rclone:latest
    container_name: mount
    environment:
      - RCLONE_REMOTE=${RCLONE_REMOTE}
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

    # --- OPTION 1: High Performance (Recommended for smooth playback) ---
    # Uses disk cache to prevent buffering. Higher CPU/Disk usage.
    command: >
      mount ${RCLONE_REMOTE}: /data/mount
      --allow-other
      --allow-non-empty
      --dir-cache-time 1000h
      --poll-interval 10s
      --vfs-cache-mode full
      --vfs-cache-max-size 10G
      --vfs-cache-max-age 12h
      --config /config/rclone/rclone.conf

    # --- OPTION 2: Low Resource (Friend's suggestion) ---
    # Saves CPU/RAM/Disk. May buffer more often. Good for small VPS.
    # To use: Comment out Option 1 above (add #), and uncomment Option 2 below (remove #).
    # command: >
    #   mount ${RCLONE_REMOTE}: /data/mount
    #   --allow-other
    #   --allow-non-empty
    #   --dir-cache-time 1000h
    #   --vfs-cache-mode writes
    #   --read-only
    #   --config /config/rclone/rclone.conf

    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/rclone:/config/rclone
      - ${MEDIA_SERVER_ROOT}/mount:/data/mount:shared
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/jellyfin:/config
      - ${MEDIA_SERVER_ROOT}/mount:/data/mount:rslave
    ports:
      - 8096:8096
    depends_on:
      - mount
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - RCLONE_REMOTE=${RCLONE_REMOTE}
      - RCLONE_USER=${RCLONE_USER}
      - RCLONE_PASS=${RCLONE_PASS}
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/radarr:/config
      - ${DOWNLOADS_FOLDER}:/downloads
      - ${MEDIA_SERVER_ROOT}/scripts:/scripts
      - ${MEDIA_SERVER_ROOT}/logs:/logs
      - ${MEDIA_SERVER_ROOT}/locks:/tmp/locks
    ports:
      - 7878:7878
    restart: unless-stopped
    
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEDIA_SERVER_ROOT}/configs/homarr:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
    ports:
      - 7575:7575
      
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Tashkent
      - PORT=5055
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/jellyseer:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    
  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    volumes:
      - ${MEDIA_SERVER_ROOT}/configs/profilarr:/config
    environment:
      - TZ=Asia/Kolkata
    ports:
      - 6868:6868
    restart: unless-stopped
   
networks:
  default:
    name: ${DOCKER_NETWORK}
    external: true